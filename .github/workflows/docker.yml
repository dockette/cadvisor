name: "Docker"

on:
  workflow_dispatch:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

env:
  CADVISOR_VERSION: "0.56.2"

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dockette/cadvisor:${{ env.CADVISOR_VERSION }}-test
          platforms: linux/amd64
          load: true
          build-args: |
            CADVISOR_VERSION=${{ env.CADVISOR_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker rm -f cadvisor-gha-test >/dev/null 2>&1 || true
          docker run -d --name cadvisor-gha-test -p 127.0.0.1:18080:8080 \
            dockette/cadvisor:${{ env.CADVISOR_VERSION }}-test
          sleep 8
          curl -fsS http://127.0.0.1:18080/healthz
          docker rm -f cadvisor-gha-test

  build:
    name: "Build"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            dockette/cadvisor:${{ env.CADVISOR_VERSION }}
            dockette/cadvisor:latest
          platforms: linux/amd64
          build-args: |
            CADVISOR_VERSION=${{ env.CADVISOR_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: "Docs"
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update DockerHub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dockette/cadvisor
          readme-filepath: ./README.md
